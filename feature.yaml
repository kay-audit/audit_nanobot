feature:
  id: finalize_nanobot
  name: nanobot-integration
  version: 1.0.0
  description: Local integration on vllm_fix; reviewed Git merges and configuration
    overlays
integration:
  base: 634afff94fd5e7154e000d62bdc3126927be54cf
  apply_method: git_merge_and_reviewed_overlays
  database_setup: operator_only_not_executed
  sources:
  - branch: feature/d6_ior
    sha: 0c709481b744043046752ff2d461819f3e65d771
    manifest: workspace/data_store/cache/sessions/finalize_nanobot_20261015/evidence/feature-d6_ior.yaml
  - branch: feature/d5_followup
    sha: d3b19c7f0ba3150729e1c5765f41113ccb7112e1
    manifest: workspace/data_store/cache/sessions/finalize_nanobot_20261015/evidence/feature-d5_followup.yaml
requires:
  nanobot_version: '>=2.5.4'
  system_deps:
  - python>=3.14
skills:
- name: ior-analyzer
  path: workspace/skills/ior-analyzer
  pattern: full
  config_section: skills.ior-analyzer
- name: follow_up
  path: workspace/skills/follow_up
  pattern: full
  config_section: skills.follow_up
tools:
- name: ior_analyzer
  path: workspace/tools/ior_analyzer.py
  config_key: ior_analyzer
  config_section: gateway.ior_analyzer
- name: follow_up
  path: workspace/tools/follow_up.py
  config_key: follow_up
  config_section: tools.follow_up
  registered_names:
  - mcp_follow_up_ask
  - mcp_follow_up_hypotheses
  - mcp_follow_up_deviations
  - mcp_follow_up_status
  - mcp_follow_up_card_start
  - mcp_follow_up_card_status
  - mcp_follow_up_forget
overlays:
  project_json:
  - op: upsert
    path: gateway.ior_analyzer.enable
    value: true
    rationale: 'Регистрация native tool через RuntimePatcher.patch_project_tools.
      config_key="ior_analyzer", секция gateway.ior_analyzer обязательна даже при
      наличии safety-дефолта в tool''е (явная запись в git diff — единственный source
      of truth для аудита).

      '
  - op: upsert
    path: skills.ior-analyzer.enabled
    value: true
    rationale: 'Регистрация доменных таблиц IOR для синхронизации в DuckDB-кэш. Без
      этой записи PgDuckDbSyncService не подхватывает таблицы, и skill получает "схема
      не существует" при попытке чтения через NanobotCacheStore. На DEV таблицы лежат
      в public (создаются V006); на ПРОМ — в GP, отдельный project.json. Выбор backend''а
      (cache vs greenplum) делается runtime-aware в data_store.py по NANOBOT_SKILLS_RUNTIME.

      '
  - op: upsert
    path: skills.ior-analyzer.tables
    value:
    - name: public.t_db_oarb_ior_d6_base_of_knowledge_ior
      tracking_column: incdnt_id
    - name: public.t_db_oarb_ior_d6_base_of_knowledge_incident_stts_chng
      tracking_column: incdnt_id
    - name: public.t_db_oarb_ior_d6_base_of_knowledge_incident_recovery
      tracking_column: incdnt_id
    - name: public.t_db_oarb_ior_d6_base_of_knowledge_incident_fin_impact
      tracking_column: incdnt_id
    - name: public.t_db_oarb_ior_d6_base_of_knowledge_incident_nonfin_impact
      tracking_column: incdnt_id
    rationale: 'tracking_column=incdnt_id — PK основной таблицы (монотонный BIGINT,
      совместим с инкрементальным sync''ом). Связанные таблицы тоже используют incdnt_id
      как FK на основную. Один tracking_column для всех 5 — корректен.

      '
  - op: upsert
    path: tools.follow_up.enable
    value: true
    rationale: 'Регистрация native tool follow_up через RuntimePatcher.patch_project_tools.
      config_key="follow_up" обязателен даже при наличии safety-дефолта в tool''е
      (явная запись в git diff — единственный source of truth для аудита).

      '
  - op: upsert
    path: skills.follow_up.enabled
    value: true
    rationale: 'Активация skill''а follow-up. Без этой записи ApplicationContext._auto_register_skills
      не зарегистрирует skill в TableRegistry, и LLM не увидит tools follow_up.

      '
  - op: upsert
    path: skills.follow_up.tables
    value:
    - name: public.t_fu_checklist
      tracking_column: updated_at
    - name: public.t_fu_km_method
      tracking_column: created_at
    - name: public.t_fu_poruch_shadow
      tracking_column: first_seen
    - name: public.t_fu_act_docs
      tracking_column: created_at
    - name: public.t_fu_repo_index
      tracking_column: parsed_at
    - name: public.t_fu_repo_files
      tracking_column: id
    rationale: 'tracking_column per-table — Pk-эквивалент для инкрементального sync''а
      через PgDuckDbSyncService. Без этой записи DuckDB-снапшот для follow-up таблиц
      не создаётся, и skill получает "схема не существует" при попытке чтения через
      DuckDB-cache.

      '
  sql_migrations:
  - sql/migrations/V006__d6_ior_tables_real.sql
  - sql/migrations/V007__d5_followup_tables.sql
tests:
- path: tests/test_ior_bge_followup_contract.py
- path: tests/test_tools_ior_analyzer.py
- path: workspace/skills/ior-analyzer/scripts/test_analysis_mode.py
- path: workspace/skills/ior-analyzer/tests/test_business_contract.py
- path: workspace/skills/ior-analyzer/scripts/test_osiris_contract.py
- path: workspace/skills/ior-analyzer/scripts/test_preset_analysis.py
- path: workspace/skills/ior-analyzer/utils/resolve/test_resolve.py
- path: workspace/skills/ior-analyzer/utils/test_data_store_cache.py
- path: workspace/skills/ior-analyzer/tests/test_source_planner.py
- path: tests/test_follow_up_llm_centralization.py
- path: tests/test_follow_up_skill.py
- path: tests/test_prepare_outbound_suppressed.py
